[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.build]
cmds = [
    "...",
    "php artisan octane:install --server=frankenphp",
    "php artisan optimize"
]

[start]
cmd = "php artisan queue:work redis & php artisan inertia:start-ssr & php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=$PORT"
