name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.3'
    - uses: actions/checkout@v4
    
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      
    - name: Install Dependencies (PHP)
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      
    - name: Generate key
      run: php artisan key:generate
      
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
      
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies (NPM)
      run: npm ci
      
    - name: Build Frontend Assets
      run: npm run build
      
    - name: Execute tests (Unit and Feature tests) via Pest/PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Trigger Laravel Forge Deployment
      uses: distributhor/workflow-webhook@v3
      env:
        webhook_url: ${{ secrets.FORGE_WEBHOOK_URL }}
        webhook_secret: ${{ secrets.FORGE_WEBHOOK_SECRET }}
      # If you are not using Forge Webhooks, you can use SSH to deploy:
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.AWS_EC2_HOST }}
      #     username: forge
      #     key: ${{ secrets.AWS_SSH_KEY }}
